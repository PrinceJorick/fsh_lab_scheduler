<!DOCTYPE html>
<html>
    <head>
        <title>Laboratory - FSH Lab Scheduler</title>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="style.css">
        <link rel="stylesheet" href="sidebar-nav.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,100..700;1,100..700&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    </head>
    <body>
        <div class="dashboard-container">
            <header class="dash-nav">
                <nav>
                    <a href="dashboard.html"><img src="../public/fsh_logo.png"></a>
                    <div class="nav-right">
                        <p id="user-display"></p>
                        <div class="profile-section">
                            <a href="profile.html" class="profile-link" title="Profile">
                                <img src="../public/User_Circle.png" alt="Profile">
                            </a>
                            <span class="profile-label">Profile</span>
                        </div>
                    </div>
                </nav>
            </header>

            <div class="lab-header">
                <div class="lab-header-content">
                    <div class="lab-header-left">
                        <h1 id="lab-name">Laboratory</h1>
                        <p>Select a date and time to make a reservation</p>
                    </div>
                    <div class="lab-header-right">
                        <button class="back-btn" onclick="goBackToDashboard()">
                            <i class="fas fa-arrow-left"></i>
                            <span>Back to Dashboard</span>
                        </button>
                    </div>
                </div>
            </div>

            <main class="main-content">
                <!-- User View (Teachers) -->
                <div id="user-view">
                    <!-- Calendar -->
                    <div class="calendar-container">
                        <div class="calendar-header">
                            <h2>Select Date</h2>
                            <div class="calendar-nav">
                                <button onclick="previousMonth()">
                                    <i class="fas fa-chevron-left"></i>
                                </button>
                                <span id="current-month-year">January 2024</span>
                                <button onclick="nextMonth()">
                                    <i class="fas fa-chevron-right"></i>
                                </button>
                            </div>
                        </div>
                        <div class="calendar-grid" id="calendar-grid"></div>
                    </div>

                    <!-- Time Slots -->
                    <div class="time-slots-container">
                        <h3>Select Time Slot</h3>
                        <div class="time-slots-grid" id="time-slots"></div>
                    </div>

                    <!-- Reservation Form -->
                    <div class="reservation-form">
                        <h3>Reservation Details</h3>
                        
                        <div id="selected-info" style="padding: 15px; background: #f9f9f9; border-radius: 10px; margin-bottom: 20px;">
                            <p style="color: #707475;">Please select a date and time slot</p>
                        </div>

                        <form id="reservation-form">
                            <div class="form-group">
                                <label for="subject">Subject</label>
                                <input type="text" id="subject" required placeholder="e.g., General Biology">
                            </div>

                            <div class="form-group">
                                <label for="grade">Grade Level</label>
                                <select id="grade" required>
                                    <option value="">Select grade level</option>
                                    <option value="11">Grade 11</option>
                                    <option value="12">Grade 12</option>
                                </select>
                            </div>

                            <div class="form-group">
                                <label for="students">Number of Students</label>
                                <input type="number" id="students" required min="1" max="50" placeholder="e.g., 30">
                            </div>

                            <div class="form-group">
                                <label for="purpose">Purpose/Activity</label>
                                <textarea id="purpose" required placeholder="Describe the planned activity or experiment"></textarea>
                            </div>

                            <button type="submit" id="submit-reservation" class="submit-reservation-btn" disabled>
                                <i class="fas fa-paper-plane"></i> Submit Reservation
                            </button>
                        </form>
                    </div>
                </div>

                <!-- Admin View -->
                <div id="admin-view" class="hidden">
                    <!-- Calendar (View Only) -->
                    <div class="calendar-container">
                        <div class="calendar-header">
                            <h2>Calendar Overview</h2>
                            <div class="calendar-nav">
                                <button onclick="previousMonth()">
                                    <i class="fas fa-chevron-left"></i>
                                </button>
                                <span id="current-month-year-admin">January 2024</span>
                                <button onclick="nextMonth()">
                                    <i class="fas fa-chevron-right"></i>
                                </button>
                            </div>
                        </div>
                        <div class="calendar-grid" id="calendar-grid-admin"></div>
                    </div>

                    <!-- Reservations Management -->
                    <div class="admin-panel">
                        <h3>Manage Reservations</h3>
                        <div id="reservations-list" class="reservations-list"></div>
                    </div>
                </div>
            </main>
        </div>

        <script src="sidebar-nav.js"></script>
        <script src="ui.js"></script>
        <script>
            // Get lab name from URL and update page
            document.addEventListener('DOMContentLoaded', () => {
                const urlParams = new URLSearchParams(window.location.search);
                const labName = urlParams.get('lab') || 'Laboratory';
                
                // Update all lab name displays
                document.getElementById('lab-name').textContent = labName;
                
                // Sync admin calendar month display
                const syncMonthDisplays = () => {
                    const mainDisplay = document.getElementById('current-month-year');
                    const adminDisplay = document.getElementById('current-month-year-admin');
                    if (mainDisplay && adminDisplay) {
                        adminDisplay.textContent = mainDisplay.textContent;
                    }
                };
                
                // Override renderCalendar to sync both calendars for admin
                const originalRenderCalendar = window.renderCalendar || renderCalendar;
                window.renderCalendar = function() {
                    if (originalRenderCalendar) {
                        originalRenderCalendar();
                    }
                    syncMonthDisplays();
                    
                    // Also render in admin view if visible
                    const role = localStorage.getItem('fsh_user_role');
                    if (role === 'Admin') {
                        const adminGrid = document.getElementById('calendar-grid-admin');
                        const mainGrid = document.getElementById('calendar-grid');
                        if (adminGrid && mainGrid) {
                            adminGrid.innerHTML = mainGrid.innerHTML;
                        }
                    }
                };
            });
        </script>
        <script src="laboratory.js"></script>
    </body>
</html>
